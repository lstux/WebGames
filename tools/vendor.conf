# Versions épinglées des composants tiers (voir THIRD_PARTY.md).
# Chargé par tools/fetch-vendor.sh.

# EmulatorJS : release GitHub contenant le code minifié et les cores WASM.
EJS_VERSION="4.2.3"
EJS_URL="https://github.com/EmulatorJS/EmulatorJS/releases/download/v${EJS_VERSION}/${EJS_VERSION}.7z"

# Cores embarqués (les autres, dont PSX/N64/PSP, sont trop lourds pour un ESP32).
# Les variantes « thread » sont exclues : elles exigent SharedArrayBuffer,
# donc un contexte sécurisé (HTTPS), indisponible en HTTP sur IP locale.
EJS_CORES="fceumm nestopia snes9x gambatte mgba genesis_plus_gx picodrive smsplus mednafen_pce cap32 crocods"

